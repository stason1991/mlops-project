name: CI Pipeline

# Запуск только при создании или обновлении Pull Request в ветку main
on:
  pull_request:
    branches:
      - main

jobs:
  # Проверка линтером
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Lint Tools
        run: |
          pip install flake8

      - name: Run Linter
        # continue-on-error: true заменяет allow_failure из GitLab
        continue-on-error: true
        run: |
          flake8 .

  # Проверка доступности данных и моделей в DVC
  dvc_fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install DVC
        # Замените [s3] на ваше хранилище (например, [gdrive], [oss] и т.д.), если нужно
        run: |
          pip install dvc[s3]

      - name: DVC Pull
        # Передаем секреты из настроек GitHub в переменные окружения
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull

  # Тестирование (запускается параллельно с остальными, тесты независимы)
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run API Tests
        run: |
          pytest
